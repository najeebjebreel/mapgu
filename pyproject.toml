[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eupg"
version = "0.1.0"
description = "Efficient Unlearning with Privacy Guarantees"
requires-python = ">=3.8"

dependencies = [
    "torch>=1.12",
    "torchvision>=0.13",
    "numpy",
    "pandas",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "tqdm",
    "diffprivlib>=0.6",
    "timm",
    "pytorch-tabnet>=4.1",
]

[project.optional-dependencies]
vision = ["torchvision"]
embeddings = ["pytorch-tabnet"]

[project.scripts]
eupg = "eupg.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["eupg*"]
